# MSS Skills Catalog
# 声明式技能索引，用于动态加载

skills:
  mss_core:
    name: "MSS L1 Core Axioms"
    path: "L1_core"
    activation:
      default: true  # 始终激活
      priority: 1
    description: "119条硬核公理，不可动摇基底"
    estimated_tokens: 800
    
  mss_protective:
    name: "MSS L2 Protective Belt"
    path: "L2_protective"
    activation:
      default: false
      conditions:
        - complexity > 0.5
        - mode: "theory"
      priority: 2
    description: "130条保护带理论，可调整假设"
    estimated_tokens: 1200
    
  mss_heuristic:
    name: "MSS L3 Heuristics"
    path: "L3_heuristic"
    activation:
      default: false
      conditions:
        - mode: "creative"
        - topic: "organization|application|practice"
      priority: 3
    description: "65条试探法，操作指南"
    estimated_tokens: 600
    
  mss_redteam:
    name: "Red Team Review"
    path: "L3_heuristic/redteam"
    activation:
      default: false
      conditions:
        - mode: "review"
        - trigger: "before_output"
      priority: 0
    description: "输出前审查规则"
    estimated_tokens: 200
    
  mss_formulas:
    name: "Formula Resources"
    path: "resources/formulas"
    activation:
      default: false
      conditions:
        - tool_call: "formula_lookup"
      priority: 4
    description: "公式索引，按需查询"
    estimated_tokens: 500
