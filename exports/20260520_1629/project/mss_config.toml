# MSS-AI Configuration File
version = "1.1.0"
debug = false
log_level = "INFO"

[model]
name = "qwen2.5:7b"
temperature = 0.05
max_tokens = 2048
gpu_layers = 999
context_window = 8192
system_prompt = ""

[arbiter]
enabled = true
auto_rewrite = true
max_retries = 3
score_threshold = 0.7
forbidden_words = ["ultimate", "perfect", "complete", "breakthrough", "solve", "transcend", "解决", "终极", "完美", "突破"]
layer_weights = { cleanliness = 0.3, layer_consistency = 0.2, rsca_compliance = 0.3, overclaim_index = 0.2 }

[responder]
enabled = true
require_markers = true
auto_add_defaults = true
max_response_tokens = 4096
persona_template = "default"

[skills]
enabled = true
auto_load = true
default_level = "L3"
max_skill_tokens = 2000
skill_paths = ["./skills/L1_core", "./skills/L2_protective", "./skills/L3_heuristic"]

[monitoring]
enabled = true
max_history = 1000
alert_on_low_success = true
success_threshold = 0.8
alert_on_slow_response = true
response_time_threshold = 10.0
export_interval_minutes = 60

[custom_settings]
