version: "3.8"

services:
  vault:
    build: .
    container_name: mssclaw-vault
    ports:
      - "5099:5099"
    volumes:
      - vault_data:/root/.mssclaw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5099/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: Run with Ollama (requires GPU)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]

volumes:
  vault_data:
