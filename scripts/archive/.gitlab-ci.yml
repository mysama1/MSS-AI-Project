# MSS-VDP GitLab CI Pipeline
# Mirror of .github/workflows/vdp-pipeline.yml for GitLab

default:
  image: python:3.11
  before_script:
    - pip install tree-sitter tree-sitter-java tree-sitter-cpp tree-sitter-c tree-sitter-go tree-sitter-rust tree-sitter-ruby tree-sitter-php
    - mkdir -p .mss

cache:
  key: mss-vdp
  paths:
    - .mss/
    - ~/.cache/pip

stages:
  - scan
  - analyze
  - report

# ── Stage 1: Multi-Language Scan ──

python scan:
  stage: scan
  script:
    - python vdp_scan.py . --format json > .mss/vdp_python.json
    - python -c "import json;d=json.load(open('.mss/vdp_python.json'));print(f'Python: {len(d.get(\"violations\",[]))} violations')"
  artifacts:
    paths: [.mss/vdp_python.json]
    expire_in: 30 days

javascript scan:
  stage: scan
  script:
    - python js_scan.py . --json > .mss/vdp_js.json
    - python -c "import json;d=json.load(open('.mss/vdp_js.json'));print(f'JS/TS: {len(d.get(\"violations\",[]))} violations')"
  artifacts:
    paths: [.mss/vdp_js.json]
    expire_in: 30 days

