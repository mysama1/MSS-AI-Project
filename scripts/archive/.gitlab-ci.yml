# ── Stage 2: Analysis ──

dsl rules:
  stage: analyze
  script:
    - python vdp_dsl.py . --demo --json > .mss/vdp_dsl.json
  artifacts:
    paths: [.mss/vdp_dsl.json]
    expire_in: 30 days

content compliance:
  stage: analyze
  script:
    - python content_compliance.py . --recursive --json > .mss/content_compliance.json
    - python -c "import json;d=json.load(open('.mss/content_compliance.json'));r=d.get('report',{});print(f'Content: {r.get(\"total_violations\",0)} violations')"
  artifacts:
    paths: [.mss/content_compliance.json]
    expire_in: 30 days

org resilience:
  stage: analyze
  script:
    - python org_resilience.py --demo --json > .mss/org_resilience.json
    - python -c "import json;d=json.load(open('.mss/org_resilience.json'));print(f'Org: M={d[\"global\"][\"M\"]} T_o={d[\"tuning\"][\"T_o\"]}')"
  artifacts:
    paths: [.mss/org_resilience.json]
    expire_in: 30 days

# ── Stage 3: Unified Report ──

unified audit:
  stage: report
  script:
    - python vdp_pipeline.py . --json > .mss/vdp_report.json
    - |
      python -c "
      import json
      r=json.load(open('.mss/vdp_report.json'))
      total=sum(len(v.get('violations',[])) for v in r if isinstance(v,dict))
      rejects=sum(1 for v in r if isinstance(v,dict) and v.get('verdict')=='reject')
      print(f'TOTAL: {total} violations | {rejects} reject(s)')
      if rejects > 0: exit(1)
      "
  artifacts:
    paths: [.mss/vdp_report.json]
    expire_in: 30 days

smoke test:
  stage: report
  script:
    - python smoke_test.py
  artifacts:
    paths: [.mss/smoke_test_report.json]
    expire_in: 30 days

pdf report:
  stage: report
  script:
    - python report_pdf.py .mss/vdp_report.json --output .mss/vdp_report.pdf
  artifacts:
    paths: [.mss/vdp_report.pdf]
    expire_in: 30 days
  needs: [unified audit]
