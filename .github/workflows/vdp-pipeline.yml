name: MSS-VDP Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  vdp-scan:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install tree-sitter
          pip install tree-sitter-python tree-sitter-javascript tree-sitter-rust
          pip install tree-sitter-java tree-sitter-cpp tree-sitter-c
          pip install tree-sitter-go tree-sitter-ruby tree-sitter-php

      - name: VDP — Python scan
        run: |
          python vdp_scan.py . --format json > vdp_python.json
          python -c "import json; r=json.load(open('vdp_python.json')); print('Python:', len(r.get('violations',[])), 'violations')"

      - name: VDP — JS/TS scan
        run: |
          python js_scan.py . --json > vdp_js.json
          python -c "import json; r=json.load(open('vdp_js.json')); print('JS/TS:', len(r.get('violations',[])), 'violations')"

      - name: VDP — Rust scan
        run: |
          python rust_scan.py . --json > vdp_rust.json
          python -c "import json; r=json.load(open('vdp_rust.json')); print('Rust:', len(r.get('violations',[])), 'violations')"

      - name: VDP — Java/C/C++ scan
        run: |
          python java_cpp_scan.py . --json > vdp_java_cpp.json
          python -c "import json; r=json.load(open('vdp_java_cpp.json')); print('Java/C/C++:', len(r.get('violations',[])), 'violations')"

      - name: VDP — Go scan
        run: |
          python go_scan.py . --json > vdp_go.json
          python -c "import json; r=json.load(open('vdp_go.json')); print('Go:', len(r.get('violations',[])), 'violations')"

      - name: VDP — Ruby scan
        run: |
          python ruby_scan.py . --json > vdp_ruby.json
          python -c "import json; r=json.load(open('vdp_ruby.json')); print('Ruby:', len(r.get('violations',[])), 'violations')"

      - name: VDP — PHP scan
        run: |
          python php_scan.py . --json > vdp_php.json
          python -c "import json; r=json.load(open('vdp_php.json')); print('PHP:', len(r.get('violations',[])), 'violations')"

      - name: VDP — Kotlin scan
        run: |
          python kotlin_scan.py . --json > vdp_kotlin.json
          python -c "import json; r=json.load(open('vdp_kotlin.json')); print('Kotlin:', len(r.get('violations',[])), 'violations')"

      - name: VDP — C# scan
        run: |
          python csharp_scan.py . --json > vdp_csharp.json
          python -c "import json; r=json.load(open('vdp_csharp.json')); print('C#:', len(r.get('violations',[])), 'violations')"

      - name: PS — 8-point safety check
        run: |
          python ps_verify.py check --json > ps_check.json

      - name: VDP — Unified Audit
        shell: pwsh
        run: |
          python vdp_pipeline.py . --json > vdp_report.json
          python -c @'
          import json, sys
          r = json.load(open("vdp_report.json"))
          total = sum(len(v.get("violations",[])) for v in r if isinstance(v,dict))
          rejects = sum(1 for v in r if isinstance(v,dict) and v.get("verdict")=="reject")
          print(f"TOTAL: {total} violations | {rejects} reject(s)")
          sys.exit(1 if rejects > 0 else 0)
          '@

      - name: Upload JSON results
        uses: actions/upload-artifact@v4
        with:
          name: vdp-reports
          path: |
            vdp_*.json
            ps_check.json
          retention-days: 30

      - name: Generate PDF Report
        run: |
          python report_pdf.py vdp_report.json --output vdp_report.pdf

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: vdp-report-pdf
          path: vdp_report.pdf
