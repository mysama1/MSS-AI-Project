name: MSS-Agent CI

on:
  push:
    branches: [main]
    paths:
      - 'mss_agent/**'
      - 'delta_protocol.py'
      - 'tools/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install mss-agent
      run: |
        pip install -e mss_agent/

    - name: Core Module Tests
      run: |
        python -c "
        from mss_agent import MSSAgent, HeatTaxBudget, HeatTaxLevel
        from mss_agent.core.delta import DeltaProtocol
        from mss_agent.core.memory import DeltaMemory
        from mss_agent.protocols import QuorumFast, ElevationProtocol
        print('All imports OK')

        # HeatTax
        tax = HeatTaxBudget()
        tax.charge(HeatTaxLevel.L2_MEANING, 0.06, 'test')
        assert tax.l2_dominant(), 'L2 dominant failed'
        print('HeatTax OK')

        # Delta
        dp = DeltaProtocol()
        dp.tick('a', 0.9, 0.9)
        assert dp.health() == 'HEALTHY', 'Delta health failed'
        print('Delta OK')

        # Memory
        dm = DeltaMemory()
        dm.store('test', 0.8)
        assert len(dm.items) == 1, 'Memory store failed'
        print('Memory OK')

        # Agent
        a = MSSAgent(name='CI', llm=lambda p: 'OK')
        r = a.run('Design an API')
        assert not r.aborted, 'Agent pass failed'
        r2 = a.run('')
        assert r2.aborted, 'Agent abort failed'
        print('Agent OK')

        # Quorum
        qf = QuorumFast()
        qf.report('a', 0.9); qf.report('b', 0.3)
        assert 'DIVERGENT' in qf.status(), 'Quorum failed'
        print('Quorum OK')

        # Elevation
        ep = ElevationProtocol()
        r = ep.resolve('A', 'B', 'conflict')
        assert r['trapped_dim'], 'Elevation failed'
        print('Elevation OK')

        print('ALL CORE TESTS PASSED')
        "

    - name: Example Agent Tests
      run: |
        python -c "
        from mss_agent.examples import WriterAgent, ReviewerAgent, AnalystAgent
        mock = lambda p: 'OK'
        for cls, name in [(WriterAgent, 'Writer'), (ReviewerAgent, 'Reviewer'), (AnalystAgent, 'Analyst')]:
            a = cls(llm=mock)
            r = a.run('Design a meaningful task with clear requirements and goals')
            assert not r.aborted, f'{name}: meaningful task aborted'
            r2 = a.run('')
            assert r2.aborted, f'{name}: empty task not aborted'
        print('All example agents OK')
        "

    - name: Integration Demo (import check)
      run: |
        python -c "
        # Verify integration demos are syntactically valid
        import py_compile
        py_compile.compile('mss_agent/examples/maf_integration_demo.py', doraise=True)
        py_compile.compile('mss_agent/examples/langchain_integration.py', doraise=True)
        print('Integration demos: syntax OK')
        "

    - name: Cross-system Checks
      run: |
        python -c "
        import os, json
        # Images exist
        for f in ['heat_tax_pyramid.png', 'delta_decay.png', 'onion_architecture.png']:
            path = f'mss_agent/docs/images/{f}'
            assert os.path.exists(path), f'Missing image: {f}'
            assert os.path.getsize(path) > 500, f'Image too small: {f}'
        print('Images OK')

        # READMEs exist
        for f in ['README.md', 'README_CN.md']:
            path = f'mss_agent/{f}'
            assert os.path.exists(path), f'Missing doc: {f}'
        print('READMEs OK')

        # Tutorials exist
        for f in ['01_quickstart.ipynb', '02_heat_tax_deep.ipynb', '03_multi_agent.ipynb']:
            path = f'mss_agent/tutorials/{f}'
            assert os.path.exists(path), f'Missing tutorial: {f}'
        print('Tutorials OK')

        print('ALL CROSS-SYSTEM CHECKS PASSED')
        "
