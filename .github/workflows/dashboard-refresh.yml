name: Refresh Dashboard Data
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mss-agent
        run: pip install -e mss_agent/

      - name: Generate delta.json
        run: python3 tools/gen_delta.py

      - name: Generate kb_stats.json
        run: python3 tools/gen_kb_stats.py

      - name: Run benchmark
        run: python3 tools/benchmark_agent.py && cp tools/benchmark_results.json docs/benchmark_results.json

      - name: Commit updates
        run: |
          git config user.name 'MSS Dashboard Bot'
          git config user.email 'bot@mss-ai'
          git add docs/delta.json docs/kb_stats.json docs/benchmark_results.json
          git diff --staged --quiet || (git commit -m 'Auto: refresh dashboard data + benchmark' && git push)
