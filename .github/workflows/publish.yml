name: Auto-Publish to PyPI (mss-agent)

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'mss_agent/**'
      - 'tuning/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.3.1)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: pip install build twine

      - name: Build mss-agent
        run: |
          cd mss_agent
          rm -rf build/ dist/*.whl dist/*.tar.gz 2>/dev/null || true
          cp ../README.md . 2>/dev/null || echo "No README.md"
          python -m build --wheel

      - name: Verify wheel
        run: |
          cd mss_agent/dist
          python -c "
          import zipfile, sys, glob
          whls = sorted(glob.glob('*.whl'))
          whl = whls[-1]  # latest by name
          z = zipfile.ZipFile(whl)
          py_files = [n for n in z.namelist() if n.endswith('.py')]
          print(f'Wheel: {whl} | {len(py_files)} .py files')
          required = ['delta_quick_audit', 'agent_config', 'heat_tax_accountant', 'agent_orchestrator']
          for r in required:
              found = any(r in p for p in py_files)
              print(f'  {\"✅\" if found else \"❌\"} {r}')
          "

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: mss_agent/dist/
