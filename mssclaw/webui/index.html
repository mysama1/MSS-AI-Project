<!DOCTYPE html><html lang="zh" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mssclaw — AI Agent</title>
<style>
  :root{--bg:#111;--side:#18181b;--card:#25252b;--bdr:#2e2e38;--tx:#e4e4e7;
  --dim:#71717a;--ac:#7c3aed;--ac2:#6d28d9;--ok:#22c55e;--warn:#eab308;--bad:#ef4444;
  --r:8px;--f:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--m:'Cascadia Code',Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font:14px/1.5 var(--f);background:var(--bg);color:var(--tx);display:flex;height:100vh;overflow:hidden}
  /* Sidebar */
  #sb{width:260px;min-width:260px;background:var(--side);display:flex;flex-direction:column;border-right:1px solid var(--bdr)}
  #sb-top{padding:16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
  #sb-top h1{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;color:var(--tx)}
  #sb-top .ver{font-size:10px;color:var(--dim);margin-top:1px}
  .btn{background:var(--ac);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:.15s}.btn:hover{background:var(--ac2)}.btn:disabled{opacity:.5}
  .btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--bdr);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer}.btn-ghost:hover{color:var(--tx);border-color:var(--ac)}
  #sessions{flex:1;overflow-y:auto;padding:8px}
  .sess{padding:8px 10px;margin-bottom:2px;border-radius:6px;font-size:13px;color:var(--dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .12s}.sess:hover{background:var(--card);color:var(--tx)}.sess.sel{background:var(--ac);color:#fff}
  #sb-bot{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:8px}
  #sb-bot select{width:100%;padding:8px;border-radius:6px;border:1px solid var(--bdr);background:var(--card);color:var(--tx);font-size:13px;outline:none}
  #sb-status{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:4px}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}
  /* Main */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #header{padding:10px 20px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:12px;font-size:13px}
  #header .title{font-weight:600;flex:1}
  #msgs{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
  .welcome{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--dim);gap:8px}
  .welcome .icon{font-size:40px;margin-bottom:8px}
  .welcome h2{font-size:18px;font-weight:600;color:var(--tx)}
  .welcome p{font-size:13px}
  .welcome .hints{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .welcome .hint{background:var(--card);border:1px solid var(--bdr);padding:6px 14px;border-radius:20px;font-size:12px;color:var(--dim);cursor:pointer;transition:.12s}.welcome .hint:hover{color:var(--tx);border-color:var(--ac)}
  .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}
  .msg.user{align-self:flex-end;background:var(--ac);border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:4px}
  .msg pre{background:#000;padding:10px 14px;border-radius:6px;overflow-x:auto;font:13px var(--m);margin:8px 0;border:1px solid var(--bdr)}
  .msg code{font:13px var(--m);background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px}
  .msg pre code{background:0;padding:0;border-radius:0}
  .msg-footer{font-size:10px;color:var(--dim);margin-top:6px;display:flex;gap:10px}
  .stream .msg:last-child:after{content:'▊';animation:blink 1s steps(1) infinite;margin-left:2px}@keyframes blink{50%{opacity:0}}
  .sheet{position:fixed;top:0;right:0;width:380px;height:100vh;background:var(--side);border-left:1px solid var(--bdr);z-index:10;overflow-y:auto;padding:20px;display:none}.sheet.open{display:block}
  .sheet h3{font-size:14px;margin-bottom:16px}
  .metric{background:var(--card);padding:12px 16px;border-radius:var(--r);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.metric .l{font-size:13px;color:var(--dim)}.metric .v{font-size:16px;font-weight:700}
  /* Input */
  #inp-row{padding:12px 20px;border-top:1px solid var(--bdr);display:flex;gap:8px;align-items:flex-end}
  #inp-row textarea{flex:1;padding:10px 14px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--card);color:var(--tx);font:14px var(--f);resize:none;height:42px;max-height:120px;outline:none;transition:border-color .15s}
  #inp-row textarea:focus{border-color:var(--ac)}
  #stats{font-size:10px;color:var(--dim);padding:4px 20px;display:flex;gap:14px}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:0}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}
</style></head><body>

<aside id="sb">
  <div id="sb-top"><div><h1>🧬 mssclaw</h1><div class="ver">v0.3.9 · Agent</div></div><button class="btn" onclick="newChat()" title="New session (Ctrl+N)">+</button></div>
  <div id="sessions"></div>
  <div id="sb-bot">
    <select id="mdl" onchange="setModel(this.value)"><option>qwen2.5:7b</option><option>phi3:mini</option><option>mss-ai-v3.4.3-balanced</option></select>
    <div id="sb-status"><span class="dot on"></span><span id="status-text">Agent Online</span></div>
  </div>
</aside>

<main id="main">
  <div id="header">
    <span class="title" id="title">New Chat</span>
    <button class="btn-ghost" onclick="toggleSheet('health-sheet')">📊</button>
    <button class="btn-ghost" onclick="toggleSheet('models-sheet')">🤖</button>
  </div>
  <div id="msgs"><div class="welcome"><div class="icon">🧬</div><h2>mssclaw — Meaning Supremacy System</h2><p>AI Agent with heat-tax budget, delta openness, meaning-field self-check</p><div class="hints"><span class="hint" onclick="quick('解释什么是热税')">🔥 What is heat tax?</span><span class="hint" onclick="quick('解释A6矛盾升维公理')">📐 A6 Axiom</span><span class="hint" onclick="quick('mssclaw有哪些功能')">🛠️ Features</span></div></div></div>
  <div id="stats"><span id="stats-delta">Δ -=</span><span id="stats-tax">Tax = -</span><span id="stats-model">qwen2.5:7b</span><span id="stats-sess">0 sessions</span></div>
  <div id="inp-row"><textarea id="inp" placeholder="Message mssclaw... (Enter to send)" rows="1" onkeydown="k(event)" oninput="this.style.height='42px';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea><button class="btn" id="send-btn" onclick="send()">Send</button></div>
</main>

<div id="health-sheet" class="sheet"><h3>📊 System Health</h3><div id="health-data"></div></div>
<div id="models-sheet" class="sheet"><h3>🤖 Ollama Models</h3><div id="models-data"></div></div>

<script>
const API='http://127.0.0.1:5100',OLLAMA='http://localhost:11434/api/tags';
let st={sessions:JSON.parse(localStorage.mss||'[]'),cur:null,msgs:[],model:'qwen2.5:7b',sending:false};

function init(){
  if(!st.sessions.length)st.sessions=[{id:'s1',title:'New Chat',msgs:[],ts:Date.now()}];
  st.cur=st.sessions[0];st.msgs=st.cur.msgs;render();check();
  setInterval(check,15000);
}
function save(){if(st.cur){st.cur.msgs=st.msgs;st.cur.title=st.msgs.length?st.msgs[0].content.slice(0,30):'New Chat'}localStorage.mss=JSON.stringify(st.sessions)}
function render(){
  let h=st.sessions.map(s=>`<div class="sess${s.id===st.cur.id?' sel':''}" onclick="switchChat('${s.id}')">${s.title||'New Chat'}</div>`).join('');
  document.getElementById('sessions').innerHTML=h;
  let mh;
  if(!st.msgs.length)mh='<div class="welcome"><div class="icon">🧬</div><h2>mssclaw</h2><p>AI Agent ready. Start a conversation.</p></div>';
  else mh=st.msgs.map((m,i)=>`<div class="msg ${m.role}">${fmt(m.content)}${m.meta?`<div class="msg-footer">${m.meta}</div>`:''}</div>`).join('');
  document.getElementById('msgs').innerHTML=mh;document.getElementById('msgs').scrollTop=document.getElementById('msgs').scrollHeight;
  document.getElementById('title').textContent=st.cur.title||'New Chat';
  document.getElementById('stats-sess').textContent=st.sessions.length+' sessions';
}
function fmt(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}

function newChat(){save();let s={id:'s'+Date.now(),title:'New Chat',msgs:[],ts:Date.now()};st.sessions.unshift(s);st.cur=s;st.msgs=[];render()}
function switchChat(id){save();st.cur=st.sessions.find(s=>s.id===id);st.msgs=st.cur.msgs;render()}
function quick(txt){document.getElementById('inp').value=txt;send()}
function setModel(m){st.model=m;document.getElementById('stats-model').textContent=m}

async function send(){
  let inp=document.getElementById('inp'),txt=inp.value.trim();if(!txt||st.sending)return;inp.value='';inp.style.height='42px';
  st.sending=true;let btn=document.getElementById('send-btn');btn.disabled=true;btn.textContent='...';
  document.getElementById('msgs').classList.add('stream');
  st.msgs.push({role:'user',content:txt});render();
  try{
    let r=await fetch(API+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:txt})});
    if(!r.ok)throw new Error(r.status);
    let d=await r.json();
    st.msgs.push({role:'ai',content:d.output||d.response||'[empty]',meta:`Δ=${d.delta||'?'} · ${d.bridge||'?'} · ${d.elapsed_ms||0}ms · tax=${d.heat_tax||0}`});
    render();save();
  }catch(e){st.msgs.push({role:'ai',content:`⚠️ Agent offline.\n\nStart: \`mssclaw serve\``});render()}
  st.sending=false;btn.disabled=false;btn.textContent='Send';document.getElementById('msgs').classList.remove('stream');
}

async function check(){
  try{
    let r=await fetch(API+'/health');let d=await r.json();
    document.getElementById('sb-status').innerHTML=`<span class="dot ${d.alive?'on':'off'}"></span><span>${d.alive?'Agent Online':'Offline'}</span>`;
    document.getElementById('stats-delta').textContent=`Δ ${(d.delta||0).toFixed(2)}`;
    document.getElementById('stats-tax').textContent=`Tax ${((d.tax_burden||0)*100).toFixed(0)}%`;
    document.getElementById('health-data').innerHTML=`
      <div class="metric"><span class="l">Status</span><span class="v" style="color:${d.alive?'var(--ok)':'var(--bad)'}">${d.alive?'ONLINE':'OFFLINE'}</span></div>
      <div class="metric"><span class="l">Δ Openness</span><span class="v" style="color:${d.delta>0.3?'var(--ok)':'var(--warn)'}">${(d.delta||0).toFixed(3)}</span></div>
      <div class="metric"><span class="l">Tax Burden</span><span class="v">${((d.tax_burden||0)*100).toFixed(1)}%</span></div>
      <div class="metric"><span class="l">L2 Bridge</span><span class="v">${d.bridge||'?'}</span></div>
      <div class="metric" style="font-size:12px;color:var(--dim)"><span>${d.message||''}</span></div>`;
  }catch(e){document.getElementById('sb-status').innerHTML='<span class="dot off"></span><span>Offline</span>'}
  try{
    let r=await fetch(OLLAMA);let d=await r.json();
    document.getElementById('models-data').innerHTML=d.models.map(m=>`<div class="metric"><div><div style="font-weight:600;font-size:13px">${m.name}</div><div style="font-size:11px;color:var(--dim)">${(m.size/1e9).toFixed(1)}GB</div></div><span style="color:var(--ok);font-size:11px">● Ready</span></div>`).join('');
  }catch(e){}
}

function toggleSheet(id){let s=document.getElementById(id);s.classList.toggle('open')}
function k(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}if(e.key==='n'&&(e.ctrlKey||e.metaKey)){e.preventDefault();newChat()}}

init();
</script></body></html>
