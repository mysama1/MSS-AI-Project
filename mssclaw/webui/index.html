<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>mssclaw v0.3.9</title>
<style>
:root{--bg:#0f0f0f;--sidebar:#1a1a1a;--card:#222;--border:#333;--text:#eee;--muted:#888;--accent:#7c3aed;--danger:#ef4444;--success:#22c55e;--radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--mono:'Cascadia Code',Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;overflow:hidden}body{font-family:var(--font);background:var(--bg);color:var(--text);display:flex}
#sidebar{width:260px;min-width:260px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-header{padding:16px;border-bottom:1px solid var(--border)}.sidebar-header h1{font-size:16px;font-weight:700;display:flex;align-items:center;gap:6px}#sessions{flex:1;overflow-y:auto;padding:8px}.sess{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}.sess:hover{background:var(--card);color:var(--text)}.sess.active{background:var(--accent);color:#fff}
#model-bar{padding:12px 16px;border-top:1px solid var(--border)}#model-bar select{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px}
#main{flex:1;display:flex;flex-direction:column}#header{padding:10px 20px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;border-radius:50%}.dot.on{background:var(--success)}
#toolbar{display:flex;gap:4px;padding:6px 20px;border-bottom:1px solid var(--border)}.tb{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);font-size:12px;cursor:pointer;transition:.15s}.tb:hover{color:var(--text);border-color:var(--accent)}.tb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;padding:16px 20px;display:none}.panel.on{display:block}
/* Chat */
#msg{display:flex;flex-direction:column;gap:12px}.msg{max-width:85%;padding:10px 14px;border-radius:var(--radius);font-size:14px;line-height:1.6;animation:fadeIn .2s}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.msg.user{background:var(--accent);align-self:flex-end}.msg.agent{background:var(--card);align-self:flex-start}.msg pre{background:#000;padding:10px;border-radius:6px;overflow-x:auto;font-family:var(--mono);font-size:13px;margin:6px 0}.msg code{font-family:var(--mono);font-size:13px;background:rgba(255,255,255,.1);padding:1px 4px;border-radius:3px}.msg pre code{background:none;padding:0}.meta{font-size:10px;color:var(--muted);margin-top:4px}.streaming .msg:last-child::after{content:'▊';animation:blink 1s infinite}@keyframes blink{50%{opacity:0}}
/* Health */
#health-panel{display:flex;flex-direction:column;gap:12px}.metric{background:var(--card);padding:14px 18px;border-radius:var(--radius);display:flex;justify-content:space-between;align-items:center}.metric .label{font-size:13px;color:var(--muted)}.metric .val{font-size:18px;font-weight:700}.metric .val.good{color:var(--success)}.metric .val.warn{color:#eab308}.metric .val.bad{color:var(--danger)}
/* Models */
.mcard{background:var(--card);padding:14px;border-radius:var(--radius);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.mcard .mname{font-weight:600;font-size:14px}.mcard .minfo{font-size:12px;color:var(--muted)}
/* Empty */
.empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);gap:8px}.empty .icon{font-size:48px}.empty h2{font-size:18px;color:var(--text)}
/* Input */
#input-row{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px}#input-row textarea{flex:1;padding:10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-family:var(--font);resize:none;min-height:40px;max-height:100px;outline:none}#input-row textarea:focus{border-color:var(--accent)}#send{padding:10px 18px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}#send:hover{background:#6d28d9}#send:disabled{opacity:.5}
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sidebar-header"><h1>🧬 mssclaw</h1></div>
  <div id="sessions"></div>
  <div id="model-bar">
    <select id="model" onchange="S.model=this.value;upd()">
      <option>qwen2.5:7b</option><option>phi3:mini</option><option>mss-ai-v3.4.3-balanced</option>
    </select>
  </div>
</aside>

<main id="main">
  <div id="header"><span class="dot on" id="status-dot"></span><span id="title">mssclaw v0.3.9</span></div>
  <div id="toolbar">
    <button class="tb on" onclick="switchPanel('chat')">💬 Chat</button>
    <button class="tb" onclick="switchPanel('health')">📊 Health</button>
    <button class="tb" onclick="switchPanel('models')">🤖 Models</button>
    <button class="tb" onclick="switchPanel('vault')">🔐 Vault</button>
  </div>

  <div id="panels">
    <div id="chat-panel" class="panel on"><div id="msg"><div class="empty"><div class="icon">🧬</div><h2>mssclaw Agent</h2><p>Agent server: port 5100</p></div></div></div>
    <div id="health-panel" class="panel"><div id="health-data">Loading...</div></div>
    <div id="models-panel" class="panel"><div id="models-data">Loading...</div></div>
    <div id="vault-panel" class="panel"><div class="empty"><div class="icon">🔐</div><h2>Vault</h2><p>mss-vault serve → http://127.0.0.1:5099</p></div></div>
  </div>

  <div id="input-row">
    <textarea id="input" placeholder="Message (Enter=send, Shift+Enter=new line)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="send" onclick="send()">Send</button>
  </div>
</main>

<script>
const API='http://127.0.0.1:5100';
const S={sessions:JSON.parse(localStorage.mss_s||'[]'),cur:null,msgs:[],model:'qwen2.5:7b',panel:'chat'};

function init(){
  if(!S.sessions.length){S.sessions=[{id:'1',title:'Chat',msgs:[],ts:Date.now()}];save()}
  S.cur=S.sessions[0];S.msgs=S.cur.msgs;
  renderSessions();renderChat();checkHealth();
  setInterval(checkHealth,10000);
}
function save(){if(S.cur){S.cur.msgs=S.msgs;S.cur.title=S.msgs[0]?.content?.slice(0,25)||'Chat'}localStorage.mss_s=JSON.stringify(S.sessions)}
function renderSessions(){document.getElementById('sessions').innerHTML=S.sessions.map(s=>`<div class="sess${s.id===S.cur?.id?' active':''}" onclick="switchSess('${s.id}')">${s.title||'Chat'}</div>`).join('')}
function switchSess(id){save();S.cur=S.sessions.find(s=>s.id===id);S.msgs=S.cur.msgs||[];renderSessions();renderChat()}
function newSess(){save();const s={id:Date.now().toString(),title:'Chat',msgs:[],ts:Date.now()};S.sessions.unshift(s);S.cur=s;S.msgs=[];renderSessions();renderChat()}
function switchPanel(p){S.panel=p;document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));event.target.classList.add('on');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.getElementById(p+'-panel').classList.add('on');if(p==='health')checkHealth();if(p==='models')loadModels()}
function upd(){document.getElementById('model').value=S.model}

function renderChat(){
  const el=document.getElementById('msg');
  if(!S.msgs.length){el.innerHTML='<div class="empty"><div class="icon">🧬</div><h2>mssclaw Agent</h2><p>Cmd+N new session · Agent:5100</p></div>';return}
  el.innerHTML=S.msgs.map(m=>`<div class="msg ${m.role}">${fmt(m.content)}${m.meta?`<div class="meta">${m.meta}</div>`:''}</div>`).join('');
  el.parentElement.scrollTop=el.parentElement.scrollHeight;
}
function fmt(t){return(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}

async function send(){
  const inp=document.getElementById('input');const txt=inp.value.trim();if(!txt)return;inp.value='';
  addMsg('user',txt);
  const btn=document.getElementById('send');btn.disabled=true;btn.textContent='...';
  document.getElementById('msg').parentElement.classList.add('streaming');

  try{
    const r=await fetch(API+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:txt})});
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    addMsg('agent',d.output||d.response||JSON.stringify(d),`Δ=${d.delta||'?'} | ${d.bridge||'?'} | ${d.elapsed_ms||0}ms`);
  }catch(e){
    addMsg('agent',`⚠️ Agent offline (port 5100). Start: mssclaw serve`);
  }
  btn.disabled=false;btn.textContent='Send';
  document.getElementById('msg').parentElement.classList.remove('streaming');
}

function addMsg(role,content,meta){S.msgs.push({role,content,meta});renderChat();save()}

async function checkHealth(){
  try{
    const r=await fetch(API+'/health');const d=await r.json();
    document.getElementById('status-dot').className='dot '+(d.alive?'on':'');
    document.getElementById('title').textContent=d.alive?'Agent Online':'Agent Offline';
    document.getElementById('health-data').innerHTML=`
      <div class="metric"><span class="label">Status</span><span class="val ${d.alive?'good':'bad'}">${d.alive?'ONLINE':'OFFLINE'}</span></div>
      <div class="metric"><span class="label">Δ (Meaning Openness)</span><span class="val ${d.delta>0.3?'good':'warn'}">${d.delta||0}</span></div>
      <div class="metric"><span class="label">Tax Burden</span><span class="val ${d.tax_burden<0.5?'good':'warn'}">${d.tax_burden||0}</span></div>
      <div class="metric"><span class="label">L2 Bridge</span><span class="val good">${d.bridge||'?'}</span></div>
      <div class="metric"><span class="label">Message</span><span class="val" style="font-size:12px">${d.message||''}</span></div>
    `;
  }catch(e){}
}

async function loadModels(){
  try{
    const r=await fetch('http://localhost:11434/api/tags');const d=await r.json();
    document.getElementById('models-data').innerHTML=d.models.map(m=>{
      const gb=(m.size/1e9).toFixed(1);
      return `<div class="mcard"><div><div class="mname">${m.name}</div><div class="minfo">${gb}GB · ${m.details?.parameter_size||'?'}</div></div><span style="color:var(--success);font-size:12px">● Ready</span></div>`;
    }).join('');
  }catch(e){document.getElementById('models-data').innerHTML='<div class="empty"><p>Ollama offline (port 11434)</p></div>'}
}

document.addEventListener('keydown',e=>{if(e.key==='n'&&(e.metaKey||e.ctrlKey)){e.preventDefault();newSess()}});
init();
</script>
</body>
</html>
