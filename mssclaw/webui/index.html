<!DOCTYPE html><html lang="zh-CN" data-theme="dark"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mssclaw v0.3.9</title>
<style>
  :root{--bg:#09090b;--surface:#18181b;--card:#27272a;--border:#3f3f46;--muted:#52525b;--tx:#fafafa;--dim:#a1a1aa;--accent:#8b5cf6;--accent-hover:#7c3aed;--accent-dim:rgba(139,92,246,.15);--ok:#22c55e;--warn:#eab308;--err:#ef4444;--info:#3b82f6}
  [data-theme="light"]{--bg:#fff;--surface:#f4f4f5;--card:#e4e4e7;--border:#d4d4d8;--muted:#a1a1aa;--tx:#18181b;--dim:#71717a}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.5 system-ui,-apple-system,sans-serif;color:var(--tx);background:var(--bg);display:flex;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

  /* Sidebar �?collapsible */
  #sidebar{width:0;min-width:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:all .25s cubic-bezier(.4,0,.2,1);overflow:hidden;z-index:10}
  #sidebar.open{width:260px;min-width:260px}
  #sidebar-inner{width:260px;min-width:260px;display:flex;flex-direction:column;height:100%}
  .side-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;min-height:44px}
  .side-header .brand{display:flex;align-items:center;gap:8px;flex:1}
  .side-header .brand-icon{width:24px;height:24px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
  .side-header h1{font-size:14px;font-weight:700}
  #session-list{flex:1;overflow-y:auto;padding:4px 8px}
  .session{padding:7px 10px;margin-bottom:1px;border-radius:6px;font-size:13px;color:var(--dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
  .session:hover{background:var(--card);color:var(--tx)}
  .session.active{background:var(--accent-dim);color:var(--accent);font-weight:500}
  .side-footer{padding:8px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
  .side-footer select{width:100%;padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--tx);font-size:13px;outline:none}
  .side-status{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}.dot.on{background:var(--ok)}.dot.off{background:var(--err)}
  .dot.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* Sidebar toggle button �?always visible on left edge */
  #sidebar-toggle{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:20;width:20px;height:48px;background:var(--surface);border:1px solid var(--border);border-left:none;border-radius:0 6px 6px 0;cursor:pointer;color:var(--dim);font-size:10px;display:flex;align-items:center;justify-content:center;transition:all .2s;opacity:.5}
  #sidebar-toggle:hover{opacity:1;width:24px;color:var(--tx)}
  #sidebar.open~#sidebar-toggle{left:260px}

  /* Main */
  #main{flex:1;display:flex;flex-direction:column;min-width:0;transition:margin .25s cubic-bezier(.4,0,.2,1)}
  #top-bar{padding:6px 16px 6px 28px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;min-height:40px}
  #top-bar .title{font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--dim);cursor:pointer;transition:all .15s;font-size:14px}
  .icon-btn:hover{color:var(--tx);border-color:var(--muted)}
  .icon-btn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}

  #messages{flex:1;overflow-y:auto;padding:20px 24px 20px 28px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .welcome{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;color:var(--dim);gap:12px}
  .welcome-icon{font-size:40px}
  .welcome h2{font-size:18px;font-weight:700;color:var(--tx)}
  .welcome p{font-size:13px;max-width:360px}
  .quick-hints{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .hint-btn{padding:8px 16px;background:var(--card);border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--dim);cursor:pointer;transition:all .15s}
  .hint-btn:hover{color:var(--tx);border-color:var(--accent);transform:translateY(-1px)}

  .msg{max-width:85%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;animation:in .15s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .msg.ai{align-self:flex-start;background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg pre{background:#000;padding:10px 14px;border-radius:6px;overflow-x:auto;font:13px/1.5 'Cascadia Code',Consolas,monospace;margin:6px 0;border:1px solid var(--border)}
  .msg code{font:13px 'Cascadia Code',Consolas,monospace;background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px}
  .msg pre code{background:none;padding:0}
  .msg-foot{font-size:10px;color:var(--dim);margin-top:4px;display:flex;gap:8px}
  .msg.user .msg-foot{color:rgba(255,255,255,.5)}
  .streaming .msg:last-child:after{content:'�?;animation:blink 1s steps(1) infinite;color:var(--accent)}@keyframes blink{50%{opacity:0}}

  #stats-bar{padding:4px 24px 4px 28px;font-size:10px;color:var(--dim);display:flex;gap:14px;border-top:1px solid var(--border);overflow-x:auto;min-height:20px}
  #stats-bar span{white-space:nowrap}

  #input-bar{padding:10px 24px 10px 28px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
  #input-bar textarea{flex:1;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--tx);font:14px system-ui,-apple-system,sans-serif;resize:none;height:42px;max-height:120px;outline:none;transition:border-color .15s;line-height:1.5}
  #input-bar textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
  .btn-send{padding:8px 18px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
  .btn-send:hover{background:var(--accent-hover)}.btn-send:disabled{opacity:.5;cursor:default}

  /* Slide panels */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;display:none}.overlay.open{display:block}
  .panel{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:31;overflow-y:auto;padding:20px;display:none;animation:slide .2s ease-out}@keyframes slide{from{transform:translateX(100%)}}
  .panel.open{display:block}
  .panel h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .close-btn{position:absolute;top:12px;right:12px}

  .metric{background:var(--card);padding:10px 14px;border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);font-size:13px}
  .metric .v{font-weight:700;font-size:15px}.metric .v.g{color:var(--ok)}.metric .v.w{color:var(--warn)}.metric .v.e{color:var(--err)}

  .model-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
  .model-card:hover{border-color:var(--accent)}.model-card .name{font-weight:600;font-size:13px}.model-card .info{font-size:11px;color:var(--dim)}
  .model-card .use-btn{padding:4px 12px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-dim);color:var(--accent);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
  .model-card .use-btn:hover{background:var(--accent);color:#fff}

  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:0}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

  /* Minimized mode: hide top bar and stats */
  
  

  /* Pop-out floating window */
  #popout-window{position:fixed;bottom:80px;right:20px;width:420px;height:520px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5);z-index:50;display:none;flex-direction:column;resize:both;overflow:hidden;min-width:320px;min-height:320px}
  #popout-window.open{display:flex}
  #popout-window .pop-header{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;cursor:move;user-select:none;font-size:12px;font-weight:600;min-height:36px}
  #popout-window .pop-body{flex:1;overflow-y:auto;padding:12px}
  #popout-window .pop-input{padding:8px 12px;border-top:1px solid var(--border)}
  #popout-window .pop-input textarea{width:100%;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--tx);font:13px system-ui;resize:none;height:36px;max-height:80px;outline:none}
  #popout-window .resize-handle{position:absolute;top:0;left:0;right:0;height:6px;cursor:n-resize;background:transparent}
  #popout-window .msg{max-width:95%}

  /* Draggable input area */
  #input-bar{position:relative}
  #input-resize-handle{position:absolute;top:-4px;left:0;right:0;height:8px;cursor:n-resize;z-index:5}
  #input-bar textarea{transition:height .1s}
  #input-bar.resizing textarea{transition:none}
</style></head><body>

<aside id="sidebar">
  <div id="sidebar-inner">
    <div class="side-header">
      <div class="brand"><div class="brand-icon">🧬</div><h1>mssclaw</h1></div>
      <button class="icon-btn" onclick="newChat()" title="New Chat (Ctrl+N)">�?/button>
    </div>
    <div id="session-list"></div>
    <div class="side-footer">
      <select id="model-select" onchange="setModel(this.value)"><option value="qwen2.5:7b">qwen2.5:7b</option><option value="phi3:mini">phi3:mini</option><option value="mss-ai-v3.4.3-balanced">mss-ai-v3.4.3</option></select>
      <div class="side-status"><span class="dot pulse on" id="agent-dot"></span><span id="agent-text">Agent Online</span></div>
    </div>
  </div>
</aside>

<button id="sidebar-toggle" onclick="ts()" title="Toggle sidebar">◀</button>

<main id="main">
  <div id="top-bar">
    <span class="title" id="session-title">mssclaw</span>
    <button class="icon-btn" onclick="toggleMinimal()" title="Minimal mode">�?/button>
    <button class="icon-btn" id="btn-health" onclick="togglePanel('health')">📊</button>
    <button class="icon-btn" id="btn-models" onclick="togglePanel('models')">🤖</button>
    <button class="icon-btn" onclick="toggleTheme()">🌓</button>
  </div>

  <div id="messages" role="log" aria-live="polite">
    <div class="welcome"><div class="welcome-icon">🧬</div><h2>mssclaw Agent</h2><p>AI with meaning-field self-check. Hit Ctrl+N for new session.</p><div class="quick-hints"><button class="hint-btn" onclick="quick('解释热税 (A3公理)')">🔥 Heat Tax</button><button class="hint-btn" onclick="quick('什么是A6矛盾升维公理')">📐 A6 Axiom</button><button class="hint-btn" onclick="quick('写一首五言绝句')">🎨 Create</button></div></div>
  </div>

  <div id="stats-bar"><span id="st-delta">Δ 1.00</span><span id="st-tax">Tax 0%</span><span id="st-model">qwen2.5:7b</span><span id="st-bridge">STABLE</span><span id="st-sess">1 session</span></div>

  <div id="input-bar"><textarea id="chat-input" placeholder="Message (Enter=send · ?=shortcuts)" rows="1" onkeydown="inputKey(event)" oninput="this.style.height='42px';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea><button class="btn-send" id="send-btn" onclick="send()">Send</button></div>
</main>

<!-- Health Panel -->
<div class="overlay" id="health-ov" onclick="closePanels()"></div>
<div class="panel" id="health-pn"><button class="icon-btn close-btn" onclick="closePanels()">�?/button><h3>📊 System Health</h3><div id="health-data"></div></div>
<!-- Models Panel -->
<div class="overlay" id="models-ov" onclick="closePanels()"></div>
<div class="panel" id="models-pn"><button class="icon-btn close-btn" onclick="closePanels()">�?/button><h3>🤖 Models</h3><div id="models-data"></div></div>

<script>
// ══�?State ══�?const API='http://127.0.0.1:5100',OLLAMA='http://localhost:11434/api/tags';
let ST={sessions:[],cur:null,msgs:[],model:'qwen2.5:7b',sending:false,sidebarOpen:true};
const raw=localStorage.getItem('mss_v3');
ST.sessions=raw?JSON.parse(raw):[{id:'s1',title:'Chat',msgs:[],ts:Date.now()}];
ST.cur=ST.sessions[0];ST.msgs=ST.cur.msgs||[];

// ══�?Init ══�?
let popDrag={active:false,x:0,y:0};
function popout(){document.getElementById("popout-window").classList.toggle("open")}
function startDragPop(e){popDrag.active=true;popDrag.x=e.clientX;popDrag.y=e.clientY;document.addEventListener("mousemove",dragPop);document.addEventListener("mouseup",()=>{popDrag.active=false;document.removeEventListener("mousemove",dragPop)})}
function dragPop(e){if(!popDrag.active)return;const w=document.getElementById("popout-window");w.style.left=(w.offsetLeft+e.clientX-popDrag.x)+"px";w.style.top=(w.offsetTop+e.clientY-popDrag.y)+"px";w.style.right="auto";w.style.bottom="auto";popDrag.x=e.clientX;popDrag.y=e.clientY}
function startResizePop(e){e.preventDefault();const w=document.getElementById("popout-window"),startH=w.offsetHeight,startY=e.clientY;function move(ev){w.style.height=Math.max(320,startH-(ev.clientY-startY))+"px"}function up(){document.removeEventListener("mousemove",move);document.removeEventListener("mouseup",up)}document.addEventListener("mousemove",move);document.addEventListener("mouseup",up)}
function popSend(){const i=document.getElementById("pop-input"),t=i.value.trim();if(!t)return;i.value="";document.getElementById("pop-msgs").innerHTML+=`<div class="msg user">${t}</div>`;fetch(API+"/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:t})}).then(r=>r.json()).then(d=>{document.getElementById("pop-msgs").innerHTML+=`<div class="msg ai">${d.output||"[empty]"}</div>`;document.getElementById("pop-msgs").scrollTop=document.getElementById("pop-msgs").scrollHeight}).catch(()=>{document.getElementById("pop-msgs").innerHTML+=`<div class="msg ai">Offline</div>`})}

// Input resize
document.addEventListener("DOMContentLoaded",()=>{const h=document.createElement("div");h.id="input-resize-handle";h.addEventListener("mousedown",e=>{e.preventDefault();const bar=document.getElementById("input-bar"),ta=document.getElementById("chat-input"),sh=ta.offsetHeight,sy=e.clientY;bar.classList.add("resizing");function mv(ev){ta.style.height=Math.max(42,Math.min(400,sh+(sy-ev.clientY)))+"px"}function up(){bar.classList.remove("resizing");document.removeEventListener("mousemove",mv);document.removeEventListener("mouseup",up)}document.addEventListener("mousemove",mv);document.addEventListener("mouseup",up)});document.getElementById("input-bar").appendChild(h)});

function init(){
  ST.sidebarOpen=localStorage.getItem('mss_sidebar')!=='closed';
  if(ST.sidebarOpen)document.getElementById('sidebar').classList.add('open');document.getElementById('sidebar-toggle').textContent='?';
  renderAll();check();setInterval(check,15000);
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closePanels();
    if(e.key==='?'&&document.activeElement===document.getElementById('chat-input')){e.preventDefault();togglePanel('health')}
  });
}
function save(){if(ST.cur){ST.cur.msgs=ST.msgs;if(ST.msgs.length)ST.cur.title=ST.msgs[0].content.slice(0,40)}localStorage.setItem('mss_v3',JSON.stringify(ST.sessions))}

// ══�?Render ══�?function renderAll(){renderSessions();renderMessages()}
function renderSessions(){
  document.getElementById('session-list').innerHTML=ST.sessions.map(s=>`<div class="session${s.id===ST.cur.id?' active':''}" onclick="switchSession('${s.id}')">${s.title||'Chat'}</div>`).join('');
}
function renderMessages(){
  if(!ST.msgs.length){document.getElementById('messages').innerHTML='<div class="welcome"><div class="welcome-icon">🧬</div><h2>mssclaw</h2><p>Agent ready.</p></div>';return}
  document.getElementById('messages').innerHTML=ST.msgs.map(m=>`<div class="msg ${m.role}">${fmt(m.content)}${m.meta?`<div class="msg-foot">${m.meta}</div>`:''}</div>`).join('');
  document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;
  document.getElementById('session-title').textContent=ST.cur.title||'Chat';
  document.getElementById('st-sess').textContent=ST.sessions.length+' sessions';
}
function fmt(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>')}

// ══�?Actions ══�?function newChat(){save();const s={id:'s'+Date.now(),title:'Chat',msgs:[],ts:Date.now()};ST.sessions.unshift(s);ST.cur=s;ST.msgs=[];renderAll();document.getElementById('chat-input').focus()}
function switchSession(id){save();const s=ST.sessions.find(x=>x.id===id);if(!s)return;ST.cur=s;ST.msgs=s.msgs||[];renderAll()}
function setModel(m){ST.model=m;document.getElementById('model-select').value=m;document.getElementById('st-model').textContent=m}
function quick(t){document.getElementById('chat-input').value=t;send()}

async function send(){
  const inp=document.getElementById('chat-input'),t=inp.value.trim();if(!t||ST.sending)return;
  inp.value='';inp.style.height='42px';ST.sending=true;
  const btn=document.getElementById('send-btn');btn.disabled=true;btn.textContent='...';
  document.getElementById('messages').classList.add('streaming');
  ST.msgs.push({role:'user',content:t});renderMessages();
  try{
    const r=await fetch(API+'/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:t})});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const d=await r.json();
    ST.msgs.push({role:'ai',content:d.output||d.response||'[empty]',meta:`Δ ${(d.delta||0).toFixed(3)} · ${d.bridge||'STABLE'} · ${d.elapsed_ms||0}ms`});
  }catch(e){ST.msgs.push({role:'ai',content:'⚠️ Agent offline. Run: mssclaw serve'})}
  renderMessages();save();ST.sending=false;btn.disabled=false;btn.textContent='Send';
  document.getElementById('messages').classList.remove('streaming');inp.focus();
}

// ══�?Health ══�?async function check(){
  try{
    const r=await fetch(API+'/health');const d=await r.json();
    const dot=document.getElementById('agent-dot'),txt=document.getElementById('agent-text');
    dot.className=`dot pulse ${d.alive?'on':'off'}`;
    txt.textContent=d.alive?`Agent (Δ ${(d.delta||0).toFixed(2)})`:'Offline';
    document.getElementById('st-delta').textContent=`Δ ${(d.delta||0).toFixed(3)}`;
    document.getElementById('st-tax').textContent=`Tax ${((d.tax_burden||0)*100).toFixed(0)}%`;
    document.getElementById('st-bridge').textContent=d.bridge||'STABLE';
    document.getElementById('health-data').innerHTML=`
      <div class="metric"><span>Status</span><span class="v ${d.alive?'g':'e'}">${d.alive?'ONLINE':'OFFLINE'}</span></div>
      <div class="metric"><span>Δ Meaning Openness</span><span class="v ${(d.delta||0)>0.5?'g':(d.delta||0)>0.2?'w':'e'}">${(d.delta||0).toFixed(4)}</span></div>
      <div class="metric"><span>Tax Burden</span><span class="v ${(d.tax_burden||0)<0.3?'g':(d.tax_burden||0)<0.7?'w':'e'}">${((d.tax_burden||0)*100).toFixed(1)}%</span></div>
      <div class="metric"><span>L2 Bridge</span><span class="v g">${d.bridge||'STABLE'}</span></div>
      <div style="font-size:12px;color:var(--dim);margin-top:8px;padding:10px;background:var(--card);border-radius:8px">${d.message||''}</div>`;
  }catch(e){document.getElementById('agent-dot').className='dot off';document.getElementById('agent-text').textContent='Offline'}
  try{
    const r=await fetch(OLLAMA);const d=await r.json();
    document.getElementById('models-data').innerHTML=d.models.map(m=>`<div class="model-card"><div><div class="name">${m.name}</div><div class="info">${(m.size/1e9).toFixed(1)}GB</div></div><button class="use-btn" onclick="setModel('${m.name}');closePanels()">Use</button></div>`).join('');
  }catch(e){}
}

// ══�?UI ══�?function ts(){const s=document.getElementById('sidebar');s.classList.toggle('open');ST.sidebarOpen=s.classList.contains('open');localStorage.setItem('mss_sidebar',ST.sidebarOpen?'open':'closed');document.getElementById('sidebar-toggle').textContent=ST.sidebarOpen?'◀':'�?}

function togglePanel(n){const pn=document.getElementById(n+'-pn'),ov=document.getElementById(n+'-ov');if(pn.classList.contains('open')){closePanels();return}closePanels();pn.classList.add('open');ov.classList.add('open');check()}
function closePanels(){document.querySelectorAll('.panel,.overlay').forEach(e=>e.classList.remove('open'))}
function toggleTheme(){const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);localStorage.setItem('mss_theme',t)}
function inputKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}if(e.key==='n'&&e.ctrlKey){e.preventDefault();newChat()}}
